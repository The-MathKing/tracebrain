[project]
name = "tracebrain"
version = "0.1.0"
description = "A company brain for engineering orgs on FalkorDB: traceable answers, triage, and agent memory."
requires-python = ">=3.11"
dependencies = [
  "falkordb>=1.8",
  "falkordblite>=0.10",
  "anthropic",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "python-dotenv",
  "mcp",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
tracebrain-ingest = "tracebrain.ingest.cli:main"
tracebrain-mcp = "tracebrain.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracebrain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
