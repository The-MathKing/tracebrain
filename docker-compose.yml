# Full local stack with Docker: FalkorDB + TraceBrain on one port.
#   docker compose up --build      -> app http://localhost:8000, FalkorDB Browser http://localhost:3000
# Secrets (OPENROUTER_API_KEY / ANTHROPIC_API_KEY / GITHUB_TOKEN) are read from ./.env if it exists.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (falkordb-py / redis-cli)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_URL: redis://falkordb:6379
      TRACEBRAIN_SEED_ON_START: "1"
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  falkordb-data:
